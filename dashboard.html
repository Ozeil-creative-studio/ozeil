<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05001D">
<title>Dashboard — Ozeil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <symbol id="ozeil-mark" viewBox="0 0 1182 1182">
    <g transform="matrix(1.093613,0,0,1.093613,136.507054,235.290731)">

    </g>
  </symbol>
  <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-9 0 1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</defs>
</svg>

<header class="admin-header">
  <div class="brand">
    <svg class="mark"><use href="#ozeil-mark"/></svg>
    <span>Dashboard Ozeil</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="index.html" class="nav-link" style="font-size:14px;">Voir le site</a>
    <button class="btn btn-ghost" type="button" id="logoutBtn" style="padding:10px 20px;">Se déconnecter</button>
  </div>
</header>

<main class="admin-shell">

  <div class="admin-tabs">
    <button class="admin-tab active" type="button" data-tab="productsSection">Produits</button>
    <button class="admin-tab" type="button" data-tab="collectionsSection">Collections</button>
  </div>

  <section class="admin-section active" id="productsSection">
    <div class="admin-section-head">
      <h2>Produits</h2>
      <div class="right">
        <span id="productsCount"></span>
        <button class="btn btn-primary" type="button" id="productAddBtn"><svg><use href="#icon-plus"/></svg> Ajouter un produit</button>
      </div>
    </div>
    <div class="admin-list" id="productsList"></div>
  </section>

  <section class="admin-section" id="collectionsSection">
    <div class="admin-section-head">
      <h2>Collections</h2>
      <div class="right">
        <span id="collectionsCount"></span>
        <button class="btn btn-primary" type="button" id="collectionAddBtn"><svg><use href="#icon-plus"/></svg> Ajouter une collection</button>
      </div>
    </div>
    <div class="admin-list" id="collectionsList"></div>
  </section>

</main>

<div class="modal-backdrop" id="productModalBackdrop">
  <div class="admin-modal-box">
    <button class="modal-close" type="button" id="productModalCloseBtn" aria-label="Fermer"><svg><use href="#icon-close"/></svg></button>
    <form class="admin-form" id="productForm">
      <h3 id="productFormTitle">Ajouter un produit</h3>

      <div class="admin-thumb-preview" id="productThumbPreview"><span>Aperçu de l'image</span></div>

      <div class="field">
        <label for="productImage">Image</label>
        <input id="productImage" type="file" accept="image/*">
      </div>
      <div class="field">
        <label for="productTitle">Titre</label>
        <input id="productTitle" type="text" required>
      </div>
      <div class="field">
        <label for="productPrice">Prix ($)</label>
        <input id="productPrice" type="number" step="0.01" min="0" required>
      </div>
      <div class="field">
        <label for="productDesc">Description</label>
        <textarea id="productDesc" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="productPrintify">Lien Printify</label>
        <input id="productPrintify" type="url" placeholder="https://...">
      </div>
      <div class="field">
        <label for="productCollection">Collection</label>
        <select id="productCollection">
          <option value="">Aucune</option>
        </select>
      </div>
      <div class="field">
        <label for="productFeatured">Mis en vedette (accueil)</label>
        <select id="productFeatured">
          <option value="">Aucun</option>
          <option value="nouveaute">Nouveauté</option>
          <option value="meilleur_vendeur">Meilleur vendeur</option>
        </select>
      </div>

      <button class="btn btn-primary" type="submit" id="productSubmitBtn">Ajouter</button>
      <p class="admin-msg" id="productMsg"></p>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="collectionModalBackdrop">
  <div class="admin-modal-box">
    <button class="modal-close" type="button" id="collectionModalCloseBtn" aria-label="Fermer"><svg><use href="#icon-close"/></svg></button>
    <form class="admin-form" id="collectionForm">
      <h3 id="collectionFormTitle">Ajouter une collection</h3>

      <div class="admin-thumb-preview" id="collectionThumbPreview"><span>Aperçu de l'image</span></div>

      <div class="field">
        <label for="collectionImage">Image</label>
        <input id="collectionImage" type="file" accept="image/*">
      </div>
      <div class="field">
        <label for="collectionTitle">Titre</label>
        <input id="collectionTitle" type="text" required>
      </div>

      <button class="btn btn-primary" type="submit" id="collectionSubmitBtn">Ajouter</button>
      <p class="admin-msg" id="collectionMsg"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
(function () {
  if (!window.ozeilSupabase) {
    document.body.innerHTML = '<p style="padding:40px;text-align:center;">Supabase non configuré.</p>';
    return;
  }
  var sb = window.ozeilSupabase;

  var editingProductId = null;
  var editingCollectionId = null;
  var productImageFile = null;
  var collectionImageFile = null;
  var collectionsCache = [];

  function formatPrice(n) {
    return Number(n).toFixed(2).replace('.', ',') + ' $';
  }
  function slugFile(name) {
    return Date.now() + '-' + name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  }
  async function uploadImage(file) {
    var path = slugFile(file.name);
    var up = await sb.storage.from('product-images').upload(path, file, { upsert: true });
    if (up.error) throw up.error;
    return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
  }

  // ---------- auth guard ----------
  async function requireSession() {
    var session = (await sb.auth.getSession()).data.session;
    if (!session) { window.location.href = 'login.html'; return false; }
    return true;
  }
  document.getElementById('logoutBtn').addEventListener('click', async function () {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  // ---------- tabs ----------
  document.querySelectorAll('.admin-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.admin-tab').forEach(function (t) { t.classList.remove('active'); });
      document.querySelectorAll('.admin-section').forEach(function (s) { s.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
    });
  });

  // ================= PRODUCTS =================

  var productModal = document.getElementById('productModalBackdrop');

  function closeProductModal() {
    productModal.classList.remove('open');
    document.body.style.overflow = '';
  }
  function openProductModal() {
    productModal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function resetProductForm() {
    editingProductId = null;
    productImageFile = null;
    document.getElementById('productForm').reset();
    document.getElementById('productFormTitle').textContent = 'Ajouter un produit';
    document.getElementById('productSubmitBtn').textContent = 'Ajouter';
    document.getElementById('productThumbPreview').innerHTML = '<span>Aperçu de l\'image</span>';
    document.getElementById('productMsg').textContent = '';
  }

  function fillProductForm(p) {
    editingProductId = p.id;
    productImageFile = null;
    document.getElementById('productFormTitle').textContent = 'Modifier le produit';
    document.getElementById('productSubmitBtn').textContent = 'Enregistrer';
    document.getElementById('productTitle').value = p.title || '';
    document.getElementById('productPrice').value = p.price || '';
    document.getElementById('productDesc').value = p.description || '';
    document.getElementById('productPrintify').value = p.printify_url || '';
    document.getElementById('productCollection').value = p.collection_id || '';
    document.getElementById('productFeatured').value = p.featured_slot || '';
    var preview = document.getElementById('productThumbPreview');
    preview.innerHTML = p.image_url ? '<img src="' + p.image_url + '" alt="">' : '<span>Aperçu de l\'image</span>';
    openProductModal();
  }

  document.getElementById('productAddBtn').addEventListener('click', function () {
    resetProductForm();
    openProductModal();
  });
  document.getElementById('productModalCloseBtn').addEventListener('click', closeProductModal);
  productModal.addEventListener('click', function (e) {
    if (e.target === productModal) closeProductModal();
  });

  document.getElementById('productImage').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    productImageFile = file;
    var reader = new FileReader();
    reader.onload = function (ev) {
      document.getElementById('productThumbPreview').innerHTML = '<img src="' + ev.target.result + '" alt="">';
    };
    reader.readAsDataURL(file);
  });

  async function renderProducts() {
    var res = await sb.from('products').select('*').order('created_at', { ascending: true });
    var list = document.getElementById('productsList');
    var countEl = document.getElementById('productsCount');
    list.innerHTML = '';
    if (res.error) { list.innerHTML = '<p class="empty-note">Erreur de chargement.</p>'; return; }
    var products = res.data || [];
    countEl.textContent = products.length + (products.length > 1 ? ' produits' : ' produit');
    if (products.length === 0) {
      list.innerHTML = '<p class="empty-note">Aucun produit pour l\'instant.</p>';
      return;
    }
    products.forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'admin-row';

      var img = document.createElement('img');
      img.src = p.image_url || '';
      img.alt = '';
      row.appendChild(img);

      var info = document.createElement('div');
      info.className = 'info';
      var h4 = document.createElement('h4');
      h4.textContent = p.title;
      var span = document.createElement('span');
      var badge = p.featured_slot === 'nouveaute' ? ' · Nouveauté' : p.featured_slot === 'meilleur_vendeur' ? ' · Meilleur vendeur' : '';
      span.textContent = formatPrice(p.price) + badge;
      info.appendChild(h4);
      info.appendChild(span);
      row.appendChild(info);

      var actions = document.createElement('div');
      actions.className = 'actions';
      var editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'admin-icon-btn';
      editBtn.setAttribute('aria-label', 'Modifier');
      editBtn.innerHTML = '<svg><use href="#icon-edit"/></svg>';
      editBtn.addEventListener('click', function () { fillProductForm(p); });
      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'admin-icon-btn danger';
      delBtn.setAttribute('aria-label', 'Supprimer');
      delBtn.innerHTML = '<svg><use href="#icon-trash"/></svg>';
      delBtn.addEventListener('click', async function () {
        if (!confirm('Supprimer "' + p.title + '" ?')) return;
        await sb.from('products').delete().eq('id', p.id);
        if (editingProductId === p.id) resetProductForm();
        renderProducts();
      });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      row.appendChild(actions);

      list.appendChild(row);
    });
  }

  document.getElementById('productForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = document.getElementById('productMsg');
    var btn = document.getElementById('productSubmitBtn');
    msg.className = 'admin-msg';
    msg.textContent = '';
    btn.disabled = true;

    try {
      var imageUrl = null;
      if (productImageFile) {
        imageUrl = await uploadImage(productImageFile);
      } else if (editingProductId) {
        var current = (await sb.from('products').select('image_url').eq('id', editingProductId).single()).data;
        imageUrl = current ? current.image_url : null;
      }

      var featuredSlot = document.getElementById('productFeatured').value || null;
      var payload = {
        title: document.getElementById('productTitle').value.trim(),
        price: parseFloat(document.getElementById('productPrice').value),
        description: document.getElementById('productDesc').value.trim(),
        printify_url: document.getElementById('productPrintify').value.trim() || null,
        collection_id: document.getElementById('productCollection').value || null,
        featured_slot: featuredSlot,
        image_url: imageUrl
      };

      // only one product may hold a given featured slot at a time
      if (featuredSlot) {
        var clearQuery = sb.from('products').update({ featured_slot: null }).eq('featured_slot', featuredSlot);
        if (editingProductId) clearQuery = clearQuery.neq('id', editingProductId);
        await clearQuery;
      }

      var result;
      if (editingProductId) {
        result = await sb.from('products').update(payload).eq('id', editingProductId);
      } else {
        result = await sb.from('products').insert(payload);
      }
      if (result.error) throw result.error;

      msg.className = 'admin-msg ok';
      msg.textContent = 'Enregistré.';
      resetProductForm();
      closeProductModal();
      renderProducts();
    } catch (err) {
      msg.className = 'admin-msg error';
      msg.textContent = "Erreur : " + (err.message || 'impossible d\'enregistrer.');
    } finally {
      btn.disabled = false;
    }
  });

  // ================= COLLECTIONS =================

  var collectionModal = document.getElementById('collectionModalBackdrop');

  function closeCollectionModal() {
    collectionModal.classList.remove('open');
    document.body.style.overflow = '';
  }
  function openCollectionModal() {
    collectionModal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function resetCollectionForm() {
    editingCollectionId = null;
    collectionImageFile = null;
    document.getElementById('collectionForm').reset();
    document.getElementById('collectionFormTitle').textContent = 'Ajouter une collection';
    document.getElementById('collectionSubmitBtn').textContent = 'Ajouter';
    document.getElementById('collectionThumbPreview').innerHTML = '<span>Aperçu de l\'image</span>';
    document.getElementById('collectionMsg').textContent = '';
  }

  function fillCollectionForm(c) {
    editingCollectionId = c.id;
    collectionImageFile = null;
    document.getElementById('collectionFormTitle').textContent = 'Modifier la collection';
    document.getElementById('collectionSubmitBtn').textContent = 'Enregistrer';
    document.getElementById('collectionTitle').value = c.title || '';
    var preview = document.getElementById('collectionThumbPreview');
    preview.innerHTML = c.image_url ? '<img src="' + c.image_url + '" alt="">' : '<span>Aperçu de l\'image</span>';
    openCollectionModal();
  }

  document.getElementById('collectionAddBtn').addEventListener('click', function () {
    resetCollectionForm();
    openCollectionModal();
  });
  document.getElementById('collectionModalCloseBtn').addEventListener('click', closeCollectionModal);
  collectionModal.addEventListener('click', function (e) {
    if (e.target === collectionModal) closeCollectionModal();
  });

  document.getElementById('collectionImage').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    collectionImageFile = file;
    var reader = new FileReader();
    reader.onload = function (ev) {
      document.getElementById('collectionThumbPreview').innerHTML = '<img src="' + ev.target.result + '" alt="">';
    };
    reader.readAsDataURL(file);
  });

  async function populateCollectionSelect() {
    var select = document.getElementById('productCollection');
    var current = select.value;
    select.innerHTML = '<option value="">Aucune</option>';
    collectionsCache.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.title;
      select.appendChild(opt);
    });
    select.value = current;
  }

  async function renderCollections() {
    var res = await sb.from('collections').select('*').order('created_at', { ascending: true });
    var list = document.getElementById('collectionsList');
    var countEl = document.getElementById('collectionsCount');
    list.innerHTML = '';
    if (res.error) { list.innerHTML = '<p class="empty-note">Erreur de chargement.</p>'; return; }
    collectionsCache = res.data || [];
    countEl.textContent = collectionsCache.length + (collectionsCache.length > 1 ? ' collections' : ' collection');
    populateCollectionSelect();
    if (collectionsCache.length === 0) {
      list.innerHTML = '<p class="empty-note">Aucune collection pour l\'instant.</p>';
      return;
    }
    collectionsCache.forEach(function (c) {
      var row = document.createElement('div');
      row.className = 'admin-row';

      var img = document.createElement('img');
      img.src = c.image_url || '';
      img.alt = '';
      row.appendChild(img);

      var info = document.createElement('div');
      info.className = 'info';
      var h4 = document.createElement('h4');
      h4.textContent = c.title;
      info.appendChild(h4);
      row.appendChild(info);

      var actions = document.createElement('div');
      actions.className = 'actions';
      var editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'admin-icon-btn';
      editBtn.setAttribute('aria-label', 'Modifier');
      editBtn.innerHTML = '<svg><use href="#icon-edit"/></svg>';
      editBtn.addEventListener('click', function () { fillCollectionForm(c); });
      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'admin-icon-btn danger';
      delBtn.setAttribute('aria-label', 'Supprimer');
      delBtn.innerHTML = '<svg><use href="#icon-trash"/></svg>';
      delBtn.addEventListener('click', async function () {
        if (!confirm('Supprimer la collection "' + c.title + '" ? Les produits qui en font partie resteront, juste sans collection.')) return;
        await sb.from('collections').delete().eq('id', c.id);
        if (editingCollectionId === c.id) resetCollectionForm();
        renderCollections();
      });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      row.appendChild(actions);

      list.appendChild(row);
    });
  }

  document.getElementById('collectionForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = document.getElementById('collectionMsg');
    var btn = document.getElementById('collectionSubmitBtn');
    msg.className = 'admin-msg';
    msg.textContent = '';
    btn.disabled = true;

    try {
      var imageUrl = null;
      if (collectionImageFile) {
        imageUrl = await uploadImage(collectionImageFile);
      } else if (editingCollectionId) {
        var current = (await sb.from('collections').select('image_url').eq('id', editingCollectionId).single()).data;
        imageUrl = current ? current.image_url : null;
      }

      var payload = {
        title: document.getElementById('collectionTitle').value.trim(),
        image_url: imageUrl
      };

      var result;
      if (editingCollectionId) {
        result = await sb.from('collections').update(payload).eq('id', editingCollectionId);
      } else {
        result = await sb.from('collections').insert(payload);
      }
      if (result.error) throw result.error;

      msg.className = 'admin-msg ok';
      msg.textContent = 'Enregistré.';
      resetCollectionForm();
      closeCollectionModal();
      renderCollections();
    } catch (err) {
      msg.className = 'admin-msg error';
      msg.textContent = "Erreur : " + (err.message || 'impossible d\'enregistrer.');
    } finally {
      btn.disabled = false;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    closeProductModal();
    closeCollectionModal();
  });

  // ---------- boot ----------
  (async function () {
    var ok = await requireSession();
    if (!ok) return;
    await renderCollections();
    await renderProducts();
  })();
})();
</script>

</body>
</html>
