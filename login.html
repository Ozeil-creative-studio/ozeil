    </g>
  </symbol>

<div class="auth-shell">
  <div class="auth-card">
    <div class="nav-logo">
      <svg class="mark" style="width:44px;height:44px;color:#ffffff;"><use href="#ozeil-mark"/></svg>
    </div>
    <h1>Connexion</h1>
    <p class="sub">Accès réservé à la gestion de la boutique Ozeil.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Courriel</label>
        <input id="email" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" id="loginBtn">Se connecter</button>
      <p class="auth-error" id="loginError"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
  (async function () {
    if (!window.ozeilSupabase) {
      document.getElementById('loginError').textContent = "Connexion à Supabase non configurée.";
      return;
    }
    var session = (await window.ozeilSupabase.auth.getSession()).data.session;
    if (session) {
      window.location.href = 'dashboard.html';
      return;
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var errorEl = document.getElementById('loginError');
      var btn = document.getElementById('loginBtn');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Connexion...';

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var res = await window.ozeilSupabase.auth.signInWithPassword({ email: email, password: password });

      if (res.error) {
        errorEl.textContent = "Courriel ou mot de passe incorrect.";
        btn.disabled = false;
        btn.textContent = 'Se connecter';
        return;
      }
      window.location.href = 'dashboard.html';
    });
  })();
</script>

</body>
</html>
