    </g>
  </symbol>

<div class="auth-shell">
  <div class="auth-card">
    <div class="nav-logo">
      <svg class="mark" style="width:44px;height:44px;color:#ffffff;"><use href="#ozeil-mark"/></svg>
    </div>
    <h1>Nouveau mot de passe</h1>
    <p class="sub" id="sub">Vérification du lien...</p>

    <form id="pwForm" hidden>
      <div class="field">
        <label for="password">Nouveau mot de passe</label>
        <input id="password" type="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="password2">Confirme le mot de passe</label>
        <input id="password2" type="password" required minlength="8" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" type="submit" id="pwBtn">Enregistrer</button>
      <p class="auth-error" id="pwMsg"></p>
    </form>

    <p class="auth-alt" id="backLink" hidden><a href="/mot-de-passe-oublie">Demander un nouveau lien</a></p>
  </div>
</div>

<script>window.__ozeilUrlArrivee = window.location.href;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
  (async function () {
    var sub = document.getElementById('sub');
    var form = document.getElementById('pwForm');
    var msg = document.getElementById('pwMsg');
    var btn = document.getElementById('pwBtn');
    var back = document.getElementById('backLink');
    var sb = window.ozeilSupabase;

    function echec(texte) {
      sub.textContent = texte;
      form.hidden = true;
      back.hidden = false;
    }

    if (!sb) { echec("Connexion à Supabase non configurée."); return; }

    // le lien du courriel peut arriver en deux formats selon la configuration
    var arrivee = new URL(window.__ozeilUrlArrivee || window.location.href);
    var hash = new URLSearchParams(arrivee.hash.replace(/^#/, ''));
    var query = arrivee.searchParams;
    var erreur = hash.get('error_description') || query.get('error_description');
    if (erreur) {
      echec("Ce lien n'est plus valable (il expire après une heure). Demande-en un nouveau.");
      return;
    }

    var code = query.get('code');
    if (code) {
      var ex = await sb.auth.exchangeCodeForSession(code);
      if (ex.error) { echec("Ce lien n'est plus valable. Demande-en un nouveau."); return; }
    }

    // laisse au client le temps de lire le jeton présent dans l'adresse
    var session = (await sb.auth.getSession()).data.session;
    if (!session) {
      await new Promise(function (r) { setTimeout(r, 600); });
      session = (await sb.auth.getSession()).data.session;
    }
    if (!session) {
      echec("Ouvre cette page depuis le lien reçu par courriel.");
      return;
    }

    sub.textContent = 'Choisis ton nouveau mot de passe (8 caractères minimum).';
    form.hidden = false;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      msg.className = 'auth-error';
      msg.textContent = '';

      var pw = document.getElementById('password').value;
      var pw2 = document.getElementById('password2').value;
      if (pw.length < 8) { msg.textContent = 'Le mot de passe doit faire au moins 8 caractères.'; return; }
      if (pw !== pw2) { msg.textContent = 'Les deux mots de passe ne sont pas identiques.'; return; }

      btn.disabled = true;
      btn.textContent = 'Enregistrement...';
      var res = await sb.auth.updateUser({ password: pw });
      if (res.error) {
        msg.textContent = "L'enregistrement a échoué. Réessaie ou demande un nouveau lien.";
        btn.disabled = false;
        btn.textContent = 'Enregistrer';
        return;
      }
      msg.className = 'auth-error auth-ok';
      msg.textContent = 'Mot de passe changé. Redirection vers le dashboard...';
      setTimeout(function () { window.location.href = '/dashboard'; }, 1200);
    });
  })();
</script>

</body>
</html>
